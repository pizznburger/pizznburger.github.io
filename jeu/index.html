<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Jeu concours Pizz'N'Burger - Faites tourner la roue !">
    <title>Jeu Concours - Pizz'N'Burger</title>
    <link rel="stylesheet" href="../css/style.css?v=1.8">
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Caveat:wght@400;500;600&family=Oswald:wght@400;500;600;700&family=Open+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        .game-container {
            min-height: 100vh;
            min-height: 100dvh;
            max-height: 100vh;
            max-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            background: var(--anthracite-dark);
            overflow: hidden;
            box-sizing: border-box;
        }

        .game-logo {
            flex-shrink: 0;
        }

        .game-logo img {
            height: clamp(40px, 8vh, 80px);
        }

        .game-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding-bottom: 15vh;
        }

        .game-title {
            font-family: 'Black Ops One', cursive;
            font-size: clamp(1.2rem, 4vw, 2.5rem);
            color: var(--white);
            text-align: center;
            margin-bottom: clamp(5px, 1vh, 10px);
            flex-shrink: 0;
        }

        .game-subtitle {
            color: var(--text-light);
            text-align: center;
            margin-bottom: clamp(10px, 2vh, 30px);
            font-size: clamp(0.85rem, 2.5vw, 1rem);
            flex-shrink: 0;
        }

        /* Cookie consent */
        .cookie-consent {
            background: var(--anthracite);
            border-radius: 15px;
            padding: clamp(15px, 3vh, 30px);
            max-width: 500px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .cookie-consent h2 {
            color: var(--white);
            margin-bottom: clamp(8px, 1.5vh, 15px);
            font-size: clamp(1.1rem, 3vw, 1.5rem);
        }

        .cookie-consent p {
            color: var(--text-light);
            margin-bottom: clamp(12px, 2vh, 20px);
            line-height: 1.6;
            font-size: clamp(0.85rem, 2.5vw, 1rem);
        }

        .cookie-btn {
            background: var(--accent);
            color: var(--white);
            border: none;
            padding: clamp(10px, 2vh, 15px) clamp(25px, 5vw, 40px);
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .cookie-btn:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        /* Wheel container */
        .wheel-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .wheel-container.visible {
            display: flex;
        }

        .wheel-wrapper {
            position: relative;
            width: clamp(200px, 50vh, 320px);
            height: clamp(200px, 50vh, 320px);
            margin-bottom: clamp(10px, 2vh, 30px);
        }

        @media (min-width: 768px) {
            .wheel-wrapper {
                width: clamp(280px, 50vh, 400px);
                height: clamp(280px, 50vh, 400px);
            }
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.5), 0 0 60px rgba(0,0,0,0.3);
            transition: transform 10s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            border: 6px solid var(--white);
        }

        .wheel.spinning {
            will-change: transform;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        .wheel-segment {
            position: absolute;
            width: 50%;
            height: 50%;
            top: 0;
            right: 0;
            transform-origin: bottom left;
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            box-sizing: border-box;
        }

        .wheel-labels {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .wheel-label {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .wheel-label span {
            position: absolute;
            top: 12%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.45rem;
            font-weight: 600;
            color: var(--white);
            text-align: center;
            width: 65px;
            line-height: 1.15;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        @media (min-width: 768px) {
            .wheel-label span {
                font-size: 0.55rem;
                top: 10%;
                width: 80px;
            }
        }

        .wheel-pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid var(--accent);
            z-index: 10;
            filter: drop-shadow(0 3px 5px rgba(0,0,0,0.3));
        }

        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90px;
            height: 90px;
            background: var(--white);
            border-radius: 50%;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 4px solid var(--white);
        }

        .wheel-center img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .spin-btn {
            background: linear-gradient(135deg, var(--accent), #c0392b);
            color: var(--white);
            border: none;
            padding: clamp(12px, 2vh, 20px) clamp(30px, 5vw, 50px);
            font-size: clamp(1rem, 3vw, 1.3rem);
            font-family: 'Black Ops One', cursive;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(231, 76, 60, 0.4);
            flex-shrink: 0;
        }

        .spin-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(231, 76, 60, 0.6);
        }

        .spin-btn:disabled {
            background: #666;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Result display (inside wheel container) */
        .result-content {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: resultAppear 0.6s ease-out;
            background: var(--anthracite);
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .result-content.visible {
            display: flex;
        }

        @keyframes resultAppear {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .result-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: bounce 0.5s ease infinite alternate, sparkle 1s ease infinite;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        @keyframes sparkle {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        .result-title {
            font-family: 'Black Ops One', cursive;
            font-size: 2rem;
            color: var(--accent);
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(231, 76, 60, 0.5);
        }

        .result-prize {
            font-family: 'Oswald', sans-serif;
            font-size: 1.6rem;
            color: var(--white);
            margin-bottom: 25px;
            padding: 20px 35px;
            background: linear-gradient(135deg, rgba(231, 76, 60, 0.3) 0%, rgba(231, 76, 60, 0.1) 100%);
            border: 2px solid var(--accent);
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(231, 76, 60, 0.2);
        }

        .result-date {
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .result-note {
            color: var(--text-light);
            font-size: 0.85rem;
            line-height: 1.6;
            max-width: 350px;
        }

        /* Already played */
        .already-played {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background: var(--anthracite);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .already-played h2 {
            color: var(--white);
            margin-bottom: 15px;
        }

        .already-played .result-prize {
            margin-top: 10px;
        }

        /* Hidden class */
        .hidden {
            display: none !important;
        }

        .visible {
            display: flex !important;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-logo">
            <img src="../banner.png" alt="Pizz'N'Burger">
        </div>
        <h1 class="game-title">🎰 Jeu Concours 🎰</h1>
        <p class="game-subtitle">Tentez votre chance et gagnez des récompenses !</p>
        
        <div class="game-content">
            <!-- Cookie Consent -->
            <div class="cookie-consent" id="cookieConsent">
                <h2>🍪 Accepter les cookies</h2>
                <p>Pour participer au jeu, vous devez accepter les cookies.</p>
                <button class="cookie-btn" id="acceptCookies">J'accepte&nbsp;et&nbsp;je&nbsp;joue&nbsp;!</button>
            </div>

            <!-- Wheel Game -->
            <div class="wheel-container" id="wheelContainer">
                <div class="wheel-wrapper">
                    <div class="wheel-pointer"></div>
                    <div class="wheel" id="wheel"></div>
                    <div class="wheel-center"><img src="game.png" alt="Pizz'N'Burger"></div>
                </div>
                <button class="spin-btn" id="spinBtn">Tourner&nbsp;la&nbsp;roue&nbsp;!</button>

                <!-- Result Display (inside wheel container) -->
                <div class="result-content" id="resultContent">
                    <div class="result-icon">🎉</div>
                    <h2 class="result-title">Félicitations&nbsp;!</h2>
                    <div class="result-prize" id="resultPrize"></div>
                    <p class="result-date" id="resultDate"></p>
                </div>
            </div>

            <!-- Already Played -->
            <div class="already-played" id="alreadyPlayed">
                <div class="result-icon">🎫</div>
                <h2>Vous avez déjà joué !</h2>
                <p class="result-date">Votre gain du <span id="playedDate"></span> :</p>
                <div class="result-prize" id="playedPrize"></div>
            </div>
        </div>
    </div>

    <script>
        // Prizes configuration with probabilities
        // Total must equal 1
        const prizes = [
            { name: "-50% sur une pizza", probability: 1/15, color: "#e74c3c", icon: "🍕" },
            { name: "-50% sur un burger", probability: 1/15, color: "#3498db", icon: "🍔" },
            { name: "Pizza Nutella Banane offerte", probability: 1/15, color: "#9b59b6", icon: "🍫" },
            { name: "1 Muffin offert", probability: 1/5, color: "#f39c12", icon: "🧁" },
            { name: "Boisson 33cl offerte", probability: 1/4, color: "#1abc9c", icon: "🥤" },
            { name: "1 Moelleux offert", probability: 1/8, color: "#e67e22", icon: "🍫" },
            { name: "1 Tarte aux pommes offerte", probability: 1/8, color: "#2ecc71", icon: "🥧" },
            { name: "Grande boisson offerte", probability: 1/10, color: "#34495e", icon: "🍹" }
        ];

        // Calculate segments for visual wheel (not probability-based)
        const segmentAngle = 360 / prizes.length;

        // DOM Elements
        const cookieConsent = document.getElementById('cookieConsent');
        const wheelContainer = document.getElementById('wheelContainer');
        const resultContainer = document.getElementById('resultContainer');
        const alreadyPlayed = document.getElementById('alreadyPlayed');
        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spinBtn');
        const acceptCookiesBtn = document.getElementById('acceptCookies');

        // Cookie functions
        function setCookie(name, value, days) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            document.cookie = `${name}=${encodeURIComponent(value)};expires=${date.toUTCString()};path=/;SameSite=Lax`;
        }

        function getCookie(name) {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                const [cookieName, cookieValue] = cookie.trim().split('=');
                if (cookieName === name) {
                    return decodeURIComponent(cookieValue);
                }
            }
            return null;
        }

        // Check if already played
        function checkExistingGame() {
            const gameData = getCookie('pizznburger_game');
            if (gameData) {
                const data = JSON.parse(gameData);
                document.getElementById('playedDate').textContent = data.date;
                document.getElementById('playedPrize').textContent = data.prize;
                cookieConsent.classList.add('hidden');
                alreadyPlayed.classList.add('visible');
                return true;
            }
            return false;
        }

        // Create wheel segments
        function createWheel() {
            // Create colored segments (without text)
            prizes.forEach((prize, index) => {
                const segment = document.createElement('div');
                segment.className = 'wheel-segment';
                segment.style.background = prize.color;
                segment.style.transform = `rotate(${index * segmentAngle}deg) skewY(${-(90 - segmentAngle)}deg)`;
                wheel.appendChild(segment);
            });

            // Create labels container
            const labelsContainer = document.createElement('div');
            labelsContainer.className = 'wheel-labels';
            
            // Create labels (positioned correctly)
            prizes.forEach((prize, index) => {
                const label = document.createElement('div');
                label.className = 'wheel-label';
                // Rotate to center of segment
                label.style.transform = `rotate(${index * segmentAngle + segmentAngle / 2}deg)`;
                
                const span = document.createElement('span');
                span.textContent = prize.name;
                label.appendChild(span);
                
                labelsContainer.appendChild(label);
            });
            
            wheel.appendChild(labelsContainer);
        }

        // Get prize based on probability
        function getPrize() {
            const random = Math.random();
            let cumulative = 0;
            
            for (let prize of prizes) {
                cumulative += prize.probability;
                if (random <= cumulative) {
                    return prize;
                }
            }
            return prizes[prizes.length - 1];
        }

        // Spin the wheel
        function spinWheel() {
            spinBtn.disabled = true;
            spinBtn.textContent = 'La roue tourne...';

            const prize = getPrize();
            const prizeIndex = prizes.indexOf(prize);
            
            // Enable GPU acceleration for spinning
            wheel.classList.add('spinning');
            
            // Calculate rotation so the winning segment aligns with the pointer at top
            // The pointer is at top (0°), and labels are centered in their segments
            // Each label is at: (index * segmentAngle) + (segmentAngle / 2)
            // We need to rotate so that the winning label is at 0° (top)
            // Add random offset within segment for more natural feel
            const baseRotation = 360 * 8; // 8 full rotations
            const randomOffset = (Math.random() - 0.5) * (segmentAngle * 0.95); // Random position within segment
            const labelAngle = (prizeIndex * segmentAngle) + (segmentAngle / 2) + randomOffset;
            // Rotate counter-clockwise to bring the label to top
            const finalRotation = baseRotation - labelAngle;
            
            wheel.style.transform = `rotate(${finalRotation}deg)`;

            // After animation (10s + 0.5s buffer)
            setTimeout(() => {
                // Disable GPU acceleration after spinning
                wheel.classList.remove('spinning');
                
                const now = new Date();
                const dateStr = now.toLocaleDateString('fr-FR', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                // Save to cookie (90 days = 3 months)
                const gameData = JSON.stringify({
                    prize: prize.name,
                    date: dateStr
                });
                setCookie('pizznburger_game', gameData, 90);

                // Show result - hide wheel elements, show result in same place
                document.getElementById('resultPrize').textContent = prize.name;
                document.getElementById('resultDate').textContent = `Joué le ${dateStr}`;
                
                document.querySelector('.wheel-wrapper').style.display = 'none';
                spinBtn.style.display = 'none';
                document.getElementById('resultContent').classList.add('visible');
            }, 10500);
        }

        // Event listeners
        acceptCookiesBtn.addEventListener('click', () => {
            setCookie('pizznburger_cookies_accepted', 'true', 90);
            cookieConsent.classList.add('hidden');
            wheelContainer.classList.add('visible');
        });

        spinBtn.addEventListener('click', spinWheel);

        // Initialize
        createWheel();
        
        // Check if already played or cookies accepted
        if (!checkExistingGame()) {
            const cookiesAccepted = getCookie('pizznburger_cookies_accepted');
            if (cookiesAccepted) {
                cookieConsent.classList.add('hidden');
                wheelContainer.classList.add('visible');
            }
        }
    </script>
</body>
</html>
